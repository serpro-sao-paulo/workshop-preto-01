# CI do protótipo backend — Par 5 · Operações (Estágio 4 / DevOps)
# Compila e roda os testes unitários do núcleo migrado (Par 3 + Par 4):
# cálculo de benefício/desconto e validações de beneficiário/elegibilidade.
# Princípio do estágio: pipeline só BUILD + TEST. Nunca faz deploy nem terraform apply.
name: Protótipo Backend (Java 21)

on:
  push:
    branches: [ main, develop, "spec/**", "impl/**" ]
    paths:
      - "03-implementacao/prototipo/backend/**"
      - "03-implementacao/prototipo/infra/**"
      - ".github/workflows/prototipo-backend.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "03-implementacao/prototipo/backend/**"
      - "03-implementacao/prototipo/infra/**"
      - ".github/workflows/prototipo-backend.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + Test (mvn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-implementacao/prototipo/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes unitários
        run: mvn -B verify

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototipo-surefire-reports
          path: 03-implementacao/prototipo/backend/target/surefire-reports/
          if-no-files-found: ignore

  infra-plan:
    name: Terraform validate (plan-only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-implementacao/prototipo/infra
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (sem backend remoto)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
      # NUNCA executar `terraform apply` neste pipeline. Apenas validação/plan.

